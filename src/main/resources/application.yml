spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/BhuBharathi?currentSchema=bhubharathi
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: bhubharathi